# One case per runnable solution. `answers` are the strings that must appear in
# the run's combined stdout/stderr, in the listed order — substring matching is
# used on purpose, because these solutions were never written to a common output
# format and several of them wrap answers in prose or bury them in debug output.
#
# `repeats` overrides the default of 10 timing runs. The three slowest days are
# capped because 10 runs of day 16 and day 19 alone would be about 48 minutes.
#
# `note` records where a case does not print both parts. The 2022 solutions were
# often edited in place to go from part 1 to part 2, so for some days the part 1
# code no longer exists to run.

[[case]]
id = "day-01-py"
cmd = ["python3", "day-1.py"]
input = "inputs/day-1-input.txt"
timeout = 60
answers = ["204610"]
note = "part 2 only; the part 1 max is never printed"

[[case]]
id = "day-01-hs"
cmd = ["runghc", "day-1.hs"]
input = "inputs/day-1-input.txt"
timeout = 120
answers = ["70374", "204610"]

